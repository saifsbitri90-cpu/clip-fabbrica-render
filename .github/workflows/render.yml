name: render

# Render di un video animato da uno storyboard. Lanciato dal PC con:
#   gh workflow run render.yml -f storyboard=storyboard/prova-hd.json -f composizione=VoxelHD
# Runner senza GPU: three.js passa da --gl=swangle (indicazione ufficiale di Remotion).
# Qualita' (regole di mromidev/claude-animated-shorts): uscita 1440x2560 (--scale 1.3333),
# crf 16, fotogrammi JPEG al 95%; la scena 3D e' disegnata a dpr 2 e ridotta: contorni lisci.
on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: "percorso dello storyboard JSON"
        required: true
        default: "storyboard/prova-hd.json"
      composizione:
        description: "Voxel (monologo) o VoxelHD (dialogo ad alta qualita')"
        required: true
        default: "VoxelHD"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          npm install --no-audit --no-fund
          pip install edge-tts==7.3.1 mutagen==1.47.0
      - name: Voce e controlli dello storyboard
        run: |
          if [ "${{ inputs.composizione }}" = "VoxelHD" ]; then
            python strumenti/voce_hd.py "${{ inputs.storyboard }}"
          else
            python strumenti/voce.py "${{ inputs.storyboard }}"
          fi
      - name: Render
        run: |
          start=$(date +%s)
          # --scale 1.3333 non da' un'altezza intera (2559,94): Remotion la rifiuta. Si disegna a
          # 2160x3840 (fattore 2, esatto) e si riduce a 1440x2560 con lanczos: contorni piu' lisci.
          npx remotion render src/index.ts "${{ inputs.composizione }}" out/grezzo.mp4 --gl=swangle \
            --props=public/props.json --concurrency=4 --scale=2 --crf=16 --jpeg-quality=95
          npx remotion ffmpeg -y -i out/grezzo.mp4 -vf "scale=1440:2560:flags=lanczos" -c:v libx264 -crf 17 \
            -preset slow -pix_fmt yuv420p -c:a copy -movflags +faststart out/video.mp4
          echo "RENDER_SECONDI=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 3
