name: render

# Render di un video animato da uno storyboard. Lanciato dal PC con:
#   gh workflow run render.yml -f storyboard=storyboard/prova.json
# Runner senza GPU: three.js passa da --gl=swangle (indicazione ufficiale di Remotion).
on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: "percorso dello storyboard JSON"
        required: true
        default: "storyboard/prova.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          npm install --no-audit --no-fund
          pip install edge-tts==7.3.1
      - name: Voce e controlli dello storyboard
        run: python strumenti/voce.py "${{ inputs.storyboard }}"
      - name: Render
        run: |
          start=$(date +%s)
          npx remotion render src/index.ts Voxel out/video.mp4 --gl=swangle --props=public/props.json --concurrency=4
          echo "RENDER_SECONDI=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 3
